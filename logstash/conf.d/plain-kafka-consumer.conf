# plain-kafka-consumer.conf
input {
    kafka {
        bootstrap_servers => "kafka01:9092,kafka02:9092"
        group_id => "logstash"
        topics => ["filebeat"]
    }
}

filter {
    # convert data back into JSON
    json {
        source => "[event][original]"
    }
}

output {
    stdout {codec => rubydebug {metadata => true}}
}